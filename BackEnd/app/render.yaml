services:
  - type: web
    name: hiresense-backend
    runtime: python
    pythonVersion: 3.11.0
    buildCommand: pip install -r ./requirements.txt && python manage.py collectstatic --noinput
    startCommand: python -m gunicorn app.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
