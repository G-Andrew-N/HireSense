services:
  - type: web
    name: hiresense-backend
    runtime: python
    pythonVersion: 3.11.0
    buildCommand: pip install -r ./requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: 1
